<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Caption Player</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header>
  <button type="button" class="hamburger-btn" id="hamburgerBtn" aria-label="Open menu" aria-expanded="false" onclick="toggleMenu()">
    <span></span><span></span><span></span>
  </button>
  <div class="header-menu" id="headerMenu">
    <div class="nav-group nav-uploads">
      <button class="file-btn" id="uploadsHeaderBtn" onclick="toggleUploadsMenu()" aria-haspopup="true" aria-expanded="false">
        <span>Files</span>
        <span class="dropdown-caret" aria-hidden="true">▾</span>
      </button>
      <div class="uploads-dropdown" id="uploadsDropdown">
        <button class="file-btn" id="audioHeaderBtn" onclick="closeMenu(); document.getElementById('audioInput').click()">
          <span>Audio file</span>
          <span class="file-check" id="audioLabel"></span>
        </button>
        <button class="file-btn" id="srtHeaderBtn" onclick="closeMenu(); document.getElementById('srtInput').click()">
          <span>.srt file</span>
          <span class="file-check" id="srtLabel"></span>
        </button>
        <button class="file-btn" id="chatFileHeaderBtn" onclick="closeMenu(); document.getElementById('chatInput').click()">
          <span>Chat</span>
          <span class="file-check" id="chatLabel"></span>
        </button>
      </div>
    </div>

    <div class="nav-divider" aria-hidden="true"></div>

    <div class="nav-group nav-sidebars">
      <button class="file-btn" id="transcriptHeaderBtn" onclick="toggleTranscript()" disabled>Transcript</button>
      <button class="file-btn" id="chatHeaderBtn" onclick="toggleChat()" disabled>Chat</button>
    </div>

    <div class="nav-divider" aria-hidden="true"></div>

    <div class="nav-group nav-settings">
      <button class="file-btn" onclick="closeMenu(); togglePanel()">Settings</button>
    </div>
  </div>
</header>
<button type="button" class="fullscreen-btn" id="fullscreenBtn" aria-label="Enter full screen" title="Enter full screen" onclick="toggleFullscreen()">⛶</button>

<main id="main">
  <section class="stage">
    <div class="captions">
      <div class="caption-text" id="captionText"></div>
    </div>

  </section>
</main>

<footer>
  <div class="scrub-track" id="scrubTrack">
    <div class="scrub-bar">
      <div class="progress" id="progress"></div>
      <div id="ticksContainer"></div>
    </div>
  </div>
  <div class="transport">
    <div class="clock" id="clock">0:00 / 0:00</div>
    <div class="transport-controls">
      <button class="transport-btn cue-btn" onclick="jumpCue(-1)">◂ cue</button>
      <button class="play-btn" id="playBtn" onclick="togglePlay()" aria-label="Play or pause"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><polygon points="6,4 20,12 6,20"></polygon></svg></button>
      <button class="transport-btn cue-btn" onclick="jumpCue(1)">cue ▸</button>
    </div>
  </div>
</footer>

<div class="fullscreen-tap-zones" id="fullscreenTapZones" aria-label="Full screen playback controls">
  <button type="button" class="fullscreen-tap-zone" aria-label="Previous cue" onclick="jumpCue(-1)"></button>
  <button type="button" class="fullscreen-tap-zone" aria-label="Next cue" onclick="jumpCue(1)"></button>
</div>

<div class="sheet-backdrop" id="menuBackdrop" onclick="closeMenu()"></div>
<div class="sheet-backdrop" id="panelBackdrop" onclick="closePanel()"></div>
<div class="sheet-backdrop" id="transcriptBackdrop" onclick="closeTranscriptSheet()"></div>
<div class="sheet-backdrop" id="chatBackdrop" onclick="closeChatSheet()"></div>

<div class="style-panel" id="stylePanel" style="display: none;">
  <div class="panel-header">
    <div class="panel-title">Settings</div>
    <button class="close-btn" aria-label="Close settings panel" onclick="togglePanel()">×</button>
  </div>
  <div class="panel-section">

    <div class="setting">
      <div class="setting-label">Typeface</div>
      <select id="fontSelect" onchange="setFont(this.value)">
        <option value="Helvetica, Arial, sans-serif">Helvetica</option>
        <option value="'Helvetica Neue', Helvetica, sans-serif" selected>Helvetica Neue</option>
        <option value="Verdana, Geneva, sans-serif">Verdana</option>
        <option value="Georgia, 'Times New Roman', serif">Georgia</option>
        <option value="'Courier New', ui-monospace, monospace">Courier New</option>
        <option value="'Trebuchet MS', sans-serif">Trebuchet MS</option>
      </select>
    </div>

    <div class="setting">
      <div class="setting-label-row"><span>Size</span><span class="setting-value" id="sizeValue">56px</span></div>
      <input type="range" min="8" max="120" step="2" value="56" id="sizeSlider" onchange="setSize(this.value)">
    </div>

    <div class="setting">
      <div class="setting-label">Text colour</div>
      <div class="color-swatches" id="colorSwatches"></div>
    </div>

    <div class="setting">
      <div class="setting-label">Backing</div>
      <div class="button-group" id="edgeGroup"></div>
    </div>

    <div class="setting">
      <div class="setting-label-row"><span>Box opacity</span><span class="setting-value" id="opacityValue">78%</span></div>
      <input type="range" min="0" max="1" step="0.05" value="0.78" id="opacitySlider" onchange="setOpacity(this.value)">
    </div>

    <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px;">
      <div class="setting-label" style="margin: 0;">Transcript rail</div>
      <button class="style-btn toggle-btn" id="railBtn" onclick="toggleRail()">On</button>
    </div>

    <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px;">
      <div class="setting-label" style="margin: 0;">Chat rail</div>
      <button class="style-btn toggle-btn" id="chatRailBtn" onclick="toggleChatRail()">On</button>
    </div>

    <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px;">
      <div class="setting-label" style="margin: 0;">Chat usernames</div>
      <button class="style-btn toggle-btn" id="chatUsernamesBtn" onclick="cycleChatUsernameMode()">On</button>
    </div>

    <div class="panel-divider">Use the file buttons above to load audio, subtitles, and chat.</div>
  </div>
</div>

<div class="drag-overlay" id="dragOverlay">Drop audio, subtitles, or chat .txt</div>
<div class="error" id="error"></div>

<audio id="audio"></audio>
<input type="file" id="audioInput" accept="audio/*" onchange="loadAudio(this.files[0])">
<input type="file" id="srtInput" accept=".srt,.vtt,text/plain" onchange="loadSrt(this.files[0])">
<input type="file" id="chatInput" accept=".txt,text/plain" onchange="loadChat(this.files[0])">

<script src="js/app.js"></script>

</body>
</html>
